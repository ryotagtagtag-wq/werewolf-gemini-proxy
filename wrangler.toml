name = "werewolf-gemini-proxy"
main = "worker.js"
compatibility_date = "2026-09-01"

[vars]
# 公開するなら、自分のページのオリジンに絞る (例: "https://example.pages.dev")
# file:// で開いて使う場合は "null" を含める。空欄なら全オリジン許可
ALLOWED_ORIGINS = "https://ai-zinrou.ryopc.org"
ALLOWED_MODELS = "gemini-3.5-flash-lite"

# 任意: IPごとのレート制限 (Cloudflareの拠点ごとの概算)
[[ratelimits]]
name = "LIMITER"
namespace_id = "1001"
[ratelimits.simple]
limit = 60
period = 150